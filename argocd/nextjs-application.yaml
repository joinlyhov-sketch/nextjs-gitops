apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nextjs
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/joinlyhov-sketch/nextjs-gitops.git
    targetRevision: master
    path: charts/nextjs

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: shop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
